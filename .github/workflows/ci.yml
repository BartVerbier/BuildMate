# Backend CI — the deterministic pipeline must prove itself on every push.
#
# Runs the full pytest suite (1.6s locally; the gated real-Whisper test stays
# off in CI). Linux mirrors the Railway runtime: the platform marker installs
# faster-whisper and skips MLX, exactly as production does.
#
# The iOS lane generates the project with xcodegen (the .xcodeproj is not
# committed) and runs the unit-test target in whatever iPhone simulator the
# runner image ships — the tests are pure logic (no RoomPlan session), so
# any simulator works.

name: CI

on:
  push:
    branches: [main, prototype-v1]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the declared minimum; dev Macs run newer
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iphone/BuildPilot
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cp Secrets.example.xcconfig Secrets.xcconfig
          xcodegen generate
      - name: Unit tests (Simulator)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9A-Za-z]+( [A-Za-z]+)?' | head -1)
          echo "Simulator: $SIM"
          set -o pipefail
          xcodebuild test -project BuildPilot.xcodeproj -scheme BuildPilot \
            -destination "platform=iOS Simulator,name=$SIM" 2>&1 | \
            grep -E "Test Suite|Executed|error:|warning: " || exit 1
