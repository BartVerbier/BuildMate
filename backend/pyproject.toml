[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buildpilot-backend"
version = "0.1.0"
description = "Build Pilot local backend: deterministic estimate pipeline for painting site visits"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["buildpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
