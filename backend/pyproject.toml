[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buildpilot-backend"
version = "0.1.0"
description = "Build Pilot local backend: deterministic estimate pipeline for painting site visits"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "numpy>=1.26",
    "google-auth>=2.30",
    # Runtime HTTP client — the visualization adapter calls the image model
    # with httpx at module import time, so it is a runtime (not dev) dep.
    "httpx>=0.27",
    # Linux/Railway transcription: pure CPU, decodes audio itself (no ffmpeg
    # binary). The marker keeps it off the Apple-Silicon Mac, where MLX is
    # used instead. `pip install .` (what Railway runs) picks the right one.
    "faster-whisper>=1.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# MLX requires Apple Silicon; installed on the Mac via `pip install -e ".[whisper]"`.
# The marker means this is a no-op on Linux, so Railway never attempts it.
whisper = [
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["buildpilot*"]

[tool.setuptools.package-data]
buildpilot = ["console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient announces an httpx->httpx2 migration; we follow
    # when fastapi does. Pinned to the exact message so real warnings surface.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
