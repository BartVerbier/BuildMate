[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buildpilot-backend"
version = "0.1.0"
description = "Build Pilot local backend: deterministic estimate pipeline for painting site visits"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
# MLX requires Apple Silicon; the transcriber degrades gracefully without it.
whisper = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["buildpilot*"]

[tool.setuptools.package-data]
buildpilot = ["console.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
