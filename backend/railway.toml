# Railway deployment config for the BuildMate backend.
# Set the Railway service's Root Directory to `backend/` so this file and
# pyproject.toml are at the build root.
#
# Build: Nixpacks detects pyproject.toml and runs `pip install .`, which on
#        Linux installs faster-whisper (via the platform marker) and skips MLX.
# Run:   the app binds Railway's injected $PORT; --no-warmup keeps boot fast
#        so the health check goes green quickly (the model loads on first use).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m buildpilot --host 0.0.0.0 --port $PORT --no-warmup"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
