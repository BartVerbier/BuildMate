# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
name: BuildPilot
options:
  bundleIdPrefix: com.buildpilot
  deploymentTarget:
    iOS: "17.0"
targets:
  BuildPilot:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Build Pilot
        NSCameraUsageDescription: Build Pilot scans the room with the camera and LiDAR to measure it.
        NSMicrophoneUsageDescription: Build Pilot records the visit conversation to draft the estimate.
        NSLocalNetworkUsageDescription: Build Pilot sends the captured visit to your Mac on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
