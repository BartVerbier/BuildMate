# XcodeGen spec — regenerate the Xcode project with:  xcodegen generate
name: BuildPilot
options:
  bundleIdPrefix: com.buildpilot
  deploymentTarget:
    iOS: "17.0"
targets:
  BuildPilot:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: BuildMate
        NSCameraUsageDescription: BuildMate scans the room with the camera and LiDAR to measure it.
        NSMicrophoneUsageDescription: BuildMate records the visit conversation to draft the estimate.
        NSLocalNetworkUsageDescription: BuildMate finds your Mac on the local network and sends the captured visit to it.
        NSBonjourServices: [_buildpilot._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: CGMLMB4ZRD  # personal team — survives xcodegen regeneration
        CODE_SIGN_STYLE: Automatic
